# Define all the services (containers) that make up your application
services:
  # --------------PostgreSQL Database Service (LOCAL ONLY - NOT FOR CLOUD DB LIKE NEONDB)--------------
  # Uncomment this section if you want to use local PostgreSQL instead of cloud database
  # postgres:
  #   image: postgres:15
  #   container_name: t3-todo-postgres
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=${POSTGRES_USER:-postgres}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
  #     - POSTGRES_DB=${POSTGRES_DB:-t3_todo}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  # --------------PostgreSQL Database Service (LOCAL ONLY - NOT FOR CLOUD DB LIKE NEONDB)--------------

  # Your T3 App Service
  app:
    build: .
    # Give the container a specific name for easy reference
    container_name: t3-todo-dev
    # Automatically restart the container if it crashes or stops
    restart: unless-stopped
    # Map container port 3000 to host port 3000 for web access
    ports:
      - "3000:3000"

    # Environment variables for your application
    env_file:
      - .env

    # Keep container running in interactive mode for development instead of exiting immediately(DKDC)
    stdin_open: true
    # Allocate a pseudo-TTY for interactive commands
    tty: true
    # Add logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # --------------PostgreSQL Database Service (LOCAL ONLY - NOT FOR CLOUD DB LIKE NEONDB)--------------
    # Wait for PostgreSQL to be ready before starting the app (LOCAL POSTGRES ONLY)
    # Uncomment this section if using local PostgreSQL instead of cloud database
    # depends_on:
    #   postgres:
    #     condition: service_healthy
