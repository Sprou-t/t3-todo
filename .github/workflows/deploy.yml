# Name of this GitHub Actions workflow
name: Deploy to ECS

# Trigger the workflow on push or pull request to staging or main branches
on:
  push:
    branches: [staging, main] # Start on push to staging or main
  # pull_request:
  #   branches: [main] # Optionally, on PRs targeting main

# Only allow one concurrent deployment per branch
concurrency:
  group: ${{ github.ref }}-deploy
  cancel-in-progress: false

# Set environment-wide variables
# set the ECR_REPOSITORY environment variable so that whenever your workflow
# runs a Docker build or push command, it can reference the ECR repo name automatically using $ECR_REPOSITORY
env:
  ECR_REPOSITORY: t3-todo # Name of your ECR repository
  AWS_REGION: ap-southeast-1 # AWS region for AWS CLI operations

jobs:
  deploy: # Deploy to ECS every time a new commit is pushed to staging or main(production)
    runs-on: ubuntu-latest # Run on GitHub-hosted Ubuntu runner

    steps:
      - name: Checkout code # Checkout your repository files
        uses: actions/checkout@v4

      - name: Set environment variables
        id: env
        # Determine environment and ECS service info based on branch
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "main" ]]; then
            echo "ENV=production" >> $GITHUB_OUTPUT
            echo "ENV_SUFFIX=" >> $GITHUB_OUTPUT
            echo "CLUSTER=t3-todo" >> $GITHUB_OUTPUT
            echo "SERVICE=t3-todo-task-service-eu049xmc" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF##*/}" == "main" ]]; then
            echo "ENV=production" >> $GITHUB_OUTPUT
            echo "ENV_SUFFIX=" >> $GITHUB_OUTPUT
            echo "CLUSTER=t3-todo" >> $GITHUB_OUTPUT
            echo "SERVICE=t3-todo-task-service-eu049xmc" >> $GITHUB_OUTPUT
          else
            echo "ENV=staging" >> $GITHUB_OUTPUT
            echo "ENV_SUFFIX=-staging" >> $GITHUB_OUTPUT
            echo "CLUSTER=t3-todo-staging" >> $GITHUB_OUTPUT
            echo "SERVICE=t3-todo-staging-task-service-ih5tudbe" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials # Configure AWS CLI using github secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify secrets in AWS Secrets Manager
        run:
          | # Confirm secrets exist in AWS (uploaded via local script import-secrets.sh)
          echo "✅ Using secrets from AWS Secrets Manager at /t3-todo/${{ steps.env.outputs.ENV }}/"
          echo "   Secrets were uploaded using local import script"
          echo "   No sync needed in CI/CD pipeline"

      - name: Login to Amazon ECR # Authenticate Docker with AWS ECR
        id: login-ecr # random id -> doesnt meant anything
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }} # ECR registry URL (from login)
          IMAGE_TAG: ${{ steps.env.outputs.ENV }}-${{ github.sha }} # Tag unique to env/commit
        run: | # Build Docker image, tag it, push to ECR
          echo "🔨 Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          echo "📤 Pushing image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Replace placeholders in task definition
        id: task-def
        # name of task definition created: app-[environment]-task eg. t3-todo-staging-task
        # Fill ENV and Docker image URI variable in the ECS taskdef template with values depending on the environment/branch we are running for
        # sed (stream editor) is a Unix command used for text substitution and editing. string inside "" is wat we want to replace
        # s/\pattern/replacement/flags is how we are substituting the ENV variables and IMAGE_URI with the actual values
        # cat ...: means "print the contents of the file task-definition.json to the terminal (stdout) - only for logging and debugging
        run: |
          cp infra/taskdef.template.json task-definition.json
          sed -i "s/\${ENV}/${{ steps.env.outputs.ENV }}/g" task-definition.json
          sed -i "s/\${ENV_SUFFIX}/${{ steps.env.outputs.ENV_SUFFIX }}/g" task-definition.json
          sed -i "s|\${IMAGE_URI}|${{ steps.build-image.outputs.image }}|g" task-definition.json
          echo "📋 Task definition created:"
          cat task-definition.json

      - name: Deploy to Amazon ECS
        # Only deploy on push events(triggered by merge in my case), not pull requests
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1 # Update ECS service with new task
        with:
          task-definition: task-definition.json
          service: ${{ steps.env.outputs.SERVICE }}
          cluster: ${{ steps.env.outputs.CLUSTER }}
          wait-for-service-stability: true

      - name: Validate task definition for PR
        # Only validate on pull requests, don't deploy
        if: github.event_name == 'pull_request'
        run: |
          echo "✅ Task definition validation complete for production deployment"
          echo "📋 Would deploy with these settings:"
          echo "Environment: ${{ steps.env.outputs.ENV }}"
          echo "Cluster: ${{ steps.env.outputs.CLUSTER }}"
          echo "Service: ${{ steps.env.outputs.SERVICE }}"
          echo "Image: ${{ steps.build-image.outputs.image }}"
          echo "🔍 PR validation successful - ready to merge for production deployment!"

      - name: Deployment complete
        # Only show deployment complete message for actual deployments
        if: github.event_name == 'push'
        run: | # Print a message on success
          echo "🚀 Deployment to ${{ steps.env.outputs.ENV }} completed successfully!"
          if [[ "${{ steps.env.outputs.ENV }}" == "staging" ]]; then
            echo "🌐 Test your staging environment manually"
          fi
